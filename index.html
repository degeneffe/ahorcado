<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1976d2">
  <meta name="description" content="Juego del Ahorcado en español - PWA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Ahorcado</title>
</head>
<body>
  <header>
    <h1>El Ahorcado</h1>
  </header>

  <main class="game-container">
    <div class="canvas-container">
      <canvas id="hangman-canvas" width="350" height="350"></canvas>
    </div>

    <div id="loading">Cargando palabra...</div>
    <div id="word-display"></div>

    <div class="info-bar">
      <span>Errores: <span id="errors-count">0 / 6</span></span>
    </div>

    <div id="message" class="message"></div>
    <div id="keyboard"></div>

    <button id="new-game-btn">Nueva Partida</button>
  </main>

  <script src="api.js"></script>
  <script src="canvas.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
